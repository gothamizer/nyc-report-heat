per_source: 250
discovery_lookback_days: 90
daily_discovery_lookback_days: 14
windows:
  - 1
  - 7
  - 30
rank_window: 30d
request_timeout_seconds: 15
request_sleep_seconds: 1.0
max_workers: 2
# Domain-first harvesters feeding the persistent mention store. Every scored
# mention is verifiable evidence: a post or article carrying the exact link.
providers:
  - bluesky
  - hackernews
  - newsrss
  # reddit needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET (free script app);
  # skips cleanly if unset.
  - reddit
harvest_lookback_days: 30
harvest_domains:
  - comptroller.nyc.gov
  - rules.cityofnewyork.us
  - ibo.nyc.ny.us
  - osc.ny.gov
  - a860-gpp.nyc.gov
  # Narrowed to /assets: tracked nyc.gov reports (DOI, agency PDFs) all live
  # there. Bare nyc.gov caught viral civic-campaign and service URLs
  # (beattheheat, housingconnect, 311) that are not reports.
  - nyc.gov/assets
  - nyc.gov/html            # legacy DOT report PDFs
  - pubadvocate.nyc.gov
  - advocate.nyc.gov
  - criminaljustice.cityofnewyork.us
  - council.nyc.gov
news_feeds:
  - https://gothamist.com/feed
  - https://www.thecity.nyc/rss/index.xml
  - https://www.cityandstateny.com/rss/all/
  - https://nypost.com/metro/feed/
  - https://rss.nytimes.com/services/xml/rss/nyt/NYRegion.xml
  - https://www.amny.com/feed/
  - https://citylimits.org/feed/
  # Policy/investigative outlets that cite reports by their exact URL.
  - https://nyfocus.com/feed
  - https://nyc.streetsblog.org/feed
  - https://queenseagle.com/all?format=rss
  - https://www.brooklynpaper.com/feed/
  # TV/tabloid outlets that name reports in coverage without linking them
  # (counted via the named-in-print tier). This is how most New Yorkers
  # hear about a report, so TV coverage is core attention signal.
  - https://pix11.com/feed/
  - https://nypost.com/us-news/feed/
  - https://ny1.com/services/contentfeed.nyc%7Call-boroughs%7Cnews.landing.rss
  - https://abc7ny.com/feed/
  - https://www.cbsnews.com/newyork/latest/rss/main
  - https://www.nbcnewyork.com/?rss=y
  # Beat and borough outlets that cover agency reports regularly.
  - https://www.documentedny.com/feed/
  - https://ny.chalkbeat.org/arc/outboundfeeds/rss/
  - https://therealdeal.com/new-york/feed/
  - https://www.amsterdamnews.com/feed/
  - https://www.qchron.com/search/?f=rss
  - https://bxtimes.com/feed/
source_ids:
  # fiscal / oversight
  - doi
  - nyc_comptroller
  - nys_comptroller
  - ibo
  - rules_proposed
  - rules_adopted
  - gpp
  - council
  # agencies & bodies (config-driven scrapers in discovery.AGENCY_SOURCES)
  - ccrb
  - doc
  - boc
  - nypd
  - coib
  - mocj
  - law
  - hpd
  - nycha
  - dob
  - lpc
  - dep
  - dsny
  - dohmh
  - acs
  - dhs
  - hra
  - dfta
  - dycd
  - dot
  - dcwp
  - tlc
  - sbs
  - dof
  - pubadvocate
  - mmr
